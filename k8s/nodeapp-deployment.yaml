apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-node-app
  labels:
    app: devops-node-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-node-app
  template:
    metadata:
      labels:
        app: devops-node-app
    spec:
      containers:
        - name: devops-node-app
          # The pipeline replaces IMAGE_PLACEHOLDER with <account>.dkr.ecr.<region>.amazonaws.com/<repo>:<git-sha>
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: eks
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: devops-node-app
  labels:
    app: devops-node-app
spec:
  type: LoadBalancer
  selector:
    app: devops-node-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
